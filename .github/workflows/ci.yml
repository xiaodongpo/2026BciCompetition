name: Synthetic CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check_release.py
      - run: python -m pytest -q
      - run: python scripts/verify_weights.py --route h1 --model checkpoints/h1
      - run: python scripts/verify_weights.py --route r0 --model checkpoints/r0
      - run: python scripts/verify_weights.py --route d2 --model checkpoints/d2
      - run: python scripts/h1_synthetic_smoke.py --model checkpoints/h1 --out cache/ci_final_h1
      - run: python scripts/synthetic_smoke.py --out cache/ci_smoke
