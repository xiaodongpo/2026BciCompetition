[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-eeg-research"
version = "0.1.0"
description = "Reproducible single-channel EEG research routes for the 2026 industrial BCI competition"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
